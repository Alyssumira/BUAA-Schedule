# KSP + Compose 编译器 + R8 同 daemon，2g 在 release 构建上容易顶不住（R5 F-C9）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin 编译daemon 独立于 Gradle daemon，参数不会继承上面那行，必须单独给
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# 多模块并行构建（app / kyant-backdrop / benchmark）
org.gradle.parallel=true
# 未开启 org.gradle.caching：Gradle 构建缓存目录写入失败会直接让任务硬失败
# （实测在受限环境下报 build-cache-1/*.part 拒绝访问），需要先确认环境可写再打开：
# org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# R8 驱动的资源收缩（AGP 8.6+，本工程 8.13）。T17 实测：APK 6,353,263 → 6,199,761，少 153,502 字节
# （resources.arsc 100,484 → 67,712，res/ 555,323 → 513,562，classes.dex 也跟着少 69,404 —— 那些
# 没人读的 R$styleable / R$int 数组本身就在 dex 里）。arsc 表条目 1,162 → 703，删的全是
# appcompat / fragment / material 的 attr(169) style(117) color(51) dimen(40) drawable(36) 等，
# 本应用自己的 85 个条目**一个都没被删**（xml/ 9 个小组件与备份配置全在）。
# 能开的前提：全仓没有任何 getIdentifier / 按名字取资源的代码（唯一的 Class.forName 在
# IslandDiagnostics 读系统属性），资源都经 R.* 与 XML 引用，R8 能静态看完全部引用点。
# 复查方法（下次改依赖后重跑一遍即可）：
#   aapt2 dump resources <apk> 取全部 0x7f id，再二进制扫 resources.arsc 与 res/*.xml、
#   AndroidManifest.xml 里的 0x7f 引用，差集必须为空（实测两边都是 0 处悬空）。
# 注意 mapping/release/resources.txt 里会有 16 条 "reachable from Field int androidx.fragment.R$animator.*"
# 之类，而对应资源其实已被删：那些宿主 R$ 内部类在最终 dex 里根本不存在（查 mapping.txt 无此项），
# 是 R8 迭代收敛前的中间报告，不是漏删。
android.r8.optimizedResourceShrinking=true

# 发布版本号：整个工程只有这一个来源（app/build.gradle.kts 直接读，且刻意不给兜底默认值）。
# 改号只走一条路：`powershell -File release.ps1 X.Y.Z` —— 它会把 VERSION_CODE 顺带加一，
# 再跑测试 / lint / assembleRelease / 打包，所以 tag 与包内版本号按构造就不可能对不上。
# 为什么宁可配置期直接失败也不给默认值：漏配时若静默退回 0.1.0，发出去的包会永远自称 0.1.0 ——
# Gitee 上 tag 已经指到新版本，于是所有人都被提示"有更新"，装完仍是旧号，更新弹窗无限循环；
# 而更新是唯一还能修好其他 bug 的通道，绝不能靠"记得传 -PversionName"来保证。
VERSION_NAME=0.1.1
# 只增不减：同 versionCode 的 `install -r` 不算升级（HyperOS 启动器按 package+versionCode
# 缓存图标，换图标也不刷新），所以每次发布必须 +1，由 release.ps1 自动落盘。
VERSION_CODE=3
