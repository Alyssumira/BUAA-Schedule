# KSP + Compose 编译器 + R8 同 daemon，2g 在 release 构建上容易顶不住（R5 F-C9）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin 编译daemon 独立于 Gradle daemon，参数不会继承上面那行，必须单独给
kotlin.daemon.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# 多模块并行构建（app / kyant-backdrop / benchmark）
org.gradle.parallel=true
# 未开启 org.gradle.caching：Gradle 构建缓存目录写入失败会直接让任务硬失败
# （实测在受限环境下报 build-cache-1/*.part 拒绝访问），需要先确认环境可写再打开：
# org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 发布版本号：整个工程只有这一个来源（app/build.gradle.kts 直接读，且刻意不给兜底默认值）。
# 改号只走一条路：`powershell -File release.ps1 X.Y.Z` —— 它会把 VERSION_CODE 顺带加一，
# 再跑测试 / lint / assembleRelease / 打包，所以 tag 与包内版本号按构造就不可能对不上。
# 为什么宁可配置期直接失败也不给默认值：漏配时若静默退回 0.1.0，发出去的包会永远自称 0.1.0 ——
# Gitee 上 tag 已经指到新版本，于是所有人都被提示"有更新"，装完仍是旧号，更新弹窗无限循环；
# 而更新是唯一还能修好其他 bug 的通道，绝不能靠"记得传 -PversionName"来保证。
VERSION_NAME=0.1.0
# 只增不减：同 versionCode 的 `install -r` 不算升级（HyperOS 启动器按 package+versionCode
# 缓存图标，换图标也不刷新），所以每次发布必须 +1，由 release.ps1 自动落盘。
VERSION_CODE=2
