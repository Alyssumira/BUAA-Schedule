[versions]
agp = "8.13.0"
kotlin = "2.3.10"
ksp = "2.3.4"
coreKtx = "1.18.0"   # R5 F-C2：ReminderNotifications 用的 setRequestPromotedOngoing 只在 core ≥ 1.17 存在
lifecycle = "2.8.7"
activityCompose = "1.13.0"
composeBom = "2024.12.01"
# 液态玻璃库需要 Compose 1.11 的 GraphicsLayer.record 语义；
# 显式钉版本覆盖 BOM（material3 等保持 1.3.x，对齐 SleepDown 的组合）
composePinned = "1.11.3"
# R5 F-C1：这两个版本是"离线仓库里唯一可用"的组合，写死在目录里而不是留给 BOM 决定 ——
# material3 1.3.1 / material 1.7.6 都是照着 Compose 1.7.x 编译的，却跑在 1.11.3 运行时上。
# 升级 Compose 时必须连带换 material3，换完要重跑 §9 的四关 + 真机冒烟（Scaffold/NavHost 是主要风险面）。
material3 = "1.3.1"
material = "1.7.6"
navigationCompose = "2.8.5"
room = "2.8.3"
kotlinxSerialization = "1.8.1"
kotlinxCoroutines = "1.9.0"
okhttp = "4.12.0"
work = "2.9.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
testRunner = "1.6.2"
benchmarkMacro = "1.4.1"
uiautomator = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-pinned = { group = "androidx.compose.ui", name = "ui", version.ref = "composePinned" }
androidx-compose-foundation-pinned = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composePinned" }
# 以下 *-*-pinned 供 :app 的 constraints 块使用（R5 F-C1）：把整棵 Compose 运行时
# 树钉在 composePinned 上，不再依赖 Gradle「取高版本」的隐式抬升
androidx-compose-runtime-pinned = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composePinned" }
androidx-compose-runtime-saveable-pinned = { group = "androidx.compose.runtime", name = "runtime-saveable", version.ref = "composePinned" }
androidx-compose-animation-pinned = { group = "androidx.compose.animation", name = "animation", version.ref = "composePinned" }
androidx-compose-animation-core-pinned = { group = "androidx.compose.animation", name = "animation-core", version.ref = "composePinned" }
androidx-compose-foundation-layout-pinned = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "composePinned" }
androidx-compose-ui-graphics-pinned = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composePinned" }
androidx-compose-ui-text-pinned = { group = "androidx.compose.ui", name = "ui-text", version.ref = "composePinned" }
androidx-compose-ui-unit-pinned = { group = "androidx.compose.ui", name = "ui-unit", version.ref = "composePinned" }
androidx-compose-ui-util-pinned = { group = "androidx.compose.ui", name = "ui-util", version.ref = "composePinned" }
androidx-compose-ui-geometry-pinned = { group = "androidx.compose.ui", name = "ui-geometry", version.ref = "composePinned" }
androidx-compose-ui-tooling-pinned = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composePinned" }
androidx-compose-ui-tooling-preview-pinned = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composePinned" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-ripple = { group = "androidx.compose.material", name = "material-ripple", version.ref = "material" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
